name: Servicios de gasolineras

on:
  schedule:
    - cron: "17 3 1 * *"    # el día 1 de cada mes a las 3:17 (UTC)
  workflow_dispatch:         # botón «Run workflow» para lanzarlo a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install osmium

      - name: Descargar España de OpenStreetMap (Geofabrik)
        run: wget -q -O espana.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf

      - name: Quedarse solo con gasolineras y servicios
        run: |
          osmium tags-filter espana.osm.pbf \
            nwr/amenity=fuel,charging_station,restaurant,cafe,fast_food,toilets,atm,car_wash,compressed_air,vending_machine \
            nwr/shop=convenience,kiosk,supermarket \
            -o filtrado.osm.pbf --overwrite
          rm espana.osm.pbf

      - name: Generar archivos
        run: python scripts/generar.py filtrado.osm.pbf publico

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - id: publicar
        uses: actions/deploy-pages@v4
